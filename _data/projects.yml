  # - title: "AI Conversation Simulation ([https://chat.opena1.com/](https://chat.openai.com/))"
  - title: "AI Conversation Simulation"
    role: Research Thesis Project
    description: 
      - Researched and benchmarked leading conversational AI models to improve dialogue coherence and user engagement in a virtual-reality setting.
      - Developed an immersive VR prototype that integrates ChatGPT with Unity, writing asynchronous C# scripts to stream real-time responses.
      - Curated and pre-processed a custom dialogue dataset to fine-tune the selected model to raise response accuracy and naturalness.
      - Presented technical findings and live demonstrations to academic supervisors and faculty panels, incorporating feedback into iterative releases.
    date: Feb 2024 - Oct 2024

